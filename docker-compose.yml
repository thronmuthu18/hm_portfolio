version: '3.8'

services:
  crm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_enterprise_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - CLIENT_URL=${CLIENT_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SINGLE_ACTIVE_SESSION=true
    volumes:
      - crm_logs:/usr/src/app/backend/logs
      - crm_backups:/usr/src/app/backend/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/admin/health', (r) => process.exit(r.statusCode === 401 || r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  crm_logs:
  crm_backups:
